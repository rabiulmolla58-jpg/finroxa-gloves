<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>দ্রুত এন্ট্রি — Finroxa Gloves</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    .topbar { background: #0d6efd; color: #fff; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .topbar a { color: #fff; text-decoration: none; font-size: 14px; margin-right: 15px; }
    .container { padding: 16px; max-width: 720px; margin: 0 auto; }
    .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }

    .scan-btn {
      width: 100%; padding: 16px;
      background: #198754; color: #fff;
      border: none; border-radius: 10px;
      font-size: 17px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      margin-bottom: 12px;
    }
    #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 12px; display: none; background: #000; }
    #reader.show { display: block; }

    .or-divider { text-align: center; color: #6c757d; margin: 14px 0; font-size: 13px; position: relative; }
    .or-divider::before, .or-divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: #ddd; }
    .or-divider::before { left: 0; }
    .or-divider::after { right: 0; }

    .code-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .code-input-row input {
      flex: 1; padding: 14px;
      border: 1px solid #dce0e6; border-radius: 8px;
      font-family: inherit; font-size: 16px;
      text-transform: uppercase; letter-spacing: 1px;
      background: #fbfcfe;
    }
    .code-input-row button {
      padding: 14px 20px;
      background: #0d6efd; color: #fff;
      border: none; border-radius: 8px;
      font-family: inherit; font-size: 15px;
      font-weight: 600; cursor: pointer;
    }

    .worker-preview {
      background: #e7f1ff; border: 2px solid #0d6efd;
      border-radius: 10px; padding: 14px;
      margin-bottom: 12px; display: none;
    }
    .worker-preview.show { display: block; }
    .worker-preview .label { font-size: 12px; color: #6c757d; margin-bottom: 4px; }
    .worker-preview .name { font-size: 20px; font-weight: 700; color: #0d6efd; margin-bottom: 4px; }
    .worker-preview .rate { font-size: 13px; color: #495057; }

    .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .form-row input {
      flex: 1; padding: 16px;
      border: 1px solid #dce0e6; border-radius: 8px;
      font-family: inherit; font-size: 18px; font-weight: 600;
      text-align: center;
    }

    .btn { padding: 16px; background: #0d6efd; color: #fff; border: none; border-radius: 10px; font-family: inherit; cursor: pointer; width: 100%; font-size: 17px; font-weight: 600; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .summary { background: #e7f1ff; padding: 14px; border-radius: 10px; margin-top: 14px; font-size: 15px; text-align: center; }
    .summary strong { color: #0d6efd; font-size: 18px; }
    .entry-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 14px; }
    .entry-item:last-child { border-bottom: none; }
    .entry-item .time { color: #6c757d; font-size: 12px; }
  </style>
</head>
<body>

  <div class="topbar">
    <div>
      <a href="/app.html">← হোম</a>
      <strong>দ্রুত এন্ট্রি</strong>
    </div>
    <a href="#" id="logoutBtn">লগআউট</a>
  </div>

  <div class="container">
    <div class="card">
      <h3 style="margin-top:0;">আজকের pair এন্ট্রি</h3>

      <button class="scan-btn" id="scanBtn">📷 QR স্ক্যান করুন</button>
      <div id="reader"></div>

      <div class="or-divider">অথবা ID লিখুন</div>

      <div class="code-input-row">
        <input type="text" id="codeInput" placeholder="যেমন: W-001" autocomplete="off" />
        <button id="findBtn">খুঁজুন</button>
      </div>

      <div class="worker-preview" id="workerPreview">
        <div class="label">✅ নির্বাচিত কর্মী</div>
        <div class="name" id="previewName">—</div>
        <div class="rate" id="previewRate">—</div>
      </div>

      <div class="form-row">
        <input type="number" id="pairs" placeholder="pair" min="1" inputmode="numeric" />
        <input type="number" id="rejects" placeholder="রিজেক্ট" value="0" min="0" inputmode="numeric" />
      </div>

      <button class="btn" id="saveBtn" disabled>✅ সেভ করুন</button>

      <div class="summary" id="summary">
        আজকের মোট: <strong>0</strong> pair
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">আজকের এন্ট্রি</h3>
      <div id="todayList">
        <p style="text-align:center;color:#6c757d;">লোড হচ্ছে...</p>
      </div>
    </div>
  </div>

  <script type="module" src="/js/entry.js"></script>
</body>
</html>
