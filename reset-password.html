<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>নতুন পাসওয়ার্ড — Finroxa Gloves</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
    }
    .login-card {
      background: #fff;
      border-radius: 18px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }
    .login-card h1 {
      text-align: center;
      font-size: 22px;
      margin: 0 0 6px;
      color: #0d6efd;
    }
    .login-card p.sub {
      text-align: center;
      color: #6c757d;
      margin: 0 0 26px;
      font-size: 14px;
    }
    .logo-circle {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      background: #0d6efd;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 14px;
      color: #6c757d;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #dce0e6;
      border-radius: 10px;
      background: #fbfcfe;
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
    }
    .field input:focus {
      border-color: #0d6efd;
      background: #fff;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      background: #0d6efd;
      color: #fff;
    }
    .btn:disabled { opacity: 0.6; }
    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
      display: none;
    }
    .alert.show { display: block; }
    .alert-error { background: #fde8e8; color: #b02a2a; }
    .alert-success { background: #e6f4ea; color: #1e6b3a; }
    .footer-note {
      text-align: center;
      color: #6c757d;
      font-size: 13px;
      margin-top: 20px;
    }
    .footer-note a {
      color: #0d6efd;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-circle">F</div>
      <h1>নতুন পাসওয়ার্ড</h1>
      <p class="sub">আপনার নতুন পাসওয়ার্ড সেট করুন</p>

      <div id="alertBox" class="alert"></div>

      <form id="newPasswordForm">
        <div class="field">
          <label for="newPassword">নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
          <input type="password" id="newPassword" placeholder="••••••••" required minlength="6" />
        </div>

        <div class="field">
          <label for="confirmPassword">আবার লিখুন</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6" />
        </div>

        <button type="submit" id="saveBtn" class="btn">
          পাসওয়ার্ড সেভ করুন
        </button>
      </form>

      <p class="footer-note">
        <a href="/index.html">← লগইনে ফিরে যান</a>
      </p>
    </div>
  </div>

  <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
