<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>পেমেন্ট স্লিপ — Finroxa Gloves</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { background: #f0f2f5; }

    .topbar {
      background: #0d6efd; color: #fff; padding: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .topbar a { color: #fff; text-decoration: none; font-size: 14px; margin-right: 15px; }
    .topbar button {
      background: #198754; color: #fff; border: none;
      padding: 8px 16px; border-radius: 8px;
      font-family: inherit; cursor: pointer; font-size: 14px;
      font-weight: 600;
    }

    .container { padding: 16px; max-width: 720px; margin: 0 auto; }

    .slip-card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative;
    }

    .slip-header {
      text-align: center;
      border-bottom: 3px double #0d6efd;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }
    .slip-header h1 { margin: 0 0 6px; color: #0d6efd; font-size: 22px; }
    .slip-header p { margin: 0; font-size: 13px; color: #6c757d; }
    .slip-header .week { margin-top: 8px; font-size: 14px; color: #1a1a1a; font-weight: 600; }

    .info-row {
      display: flex; justify-content: space-between;
      padding: 6px 0;
      font-size: 15px;
      border-bottom: 1px dashed #e0e0e0;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: #6c757d; }
    .info-row .value { font-weight: 600; }

    .amount-box {
      background: #f0f8ff;
      border: 2px solid #0d6efd;
      border-radius: 12px;
      padding: 18px;
      margin: 18px 0;
      text-align: center;
    }
    .amount-box .label { color: #0d6efd; font-size: 13px; margin-bottom: 6px; }
    .amount-box .value { font-size: 34px; font-weight: 800; color: #0d6efd; }

    .signature {
      display: flex;
      justify-content: space-between;
      margin-top: 50px;
      padding-top: 30px;
    }
    .signature div {
      text-align: center;
      font-size: 13px;
      color: #6c757d;
      border-top: 1px solid #999;
      padding-top: 6px;
      width: 40%;
      min-height: 40px;
    }
    .signature img {
      max-width: 130px;
      max-height: 50px;
      display: block;
      margin: 0 auto 4px;
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #6c757d;
      margin-top: 20px;
    }

    .empty {
      text-align: center;
      color: #6c757d;
      padding: 40px 20px;
      background: #fff;
      border-radius: 14px;
      font-size: 15px;
    }

    /* Share buttons */
    .share-bar {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .share-btn {
      flex: 1;
      min-width: 120px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .share-wa { background: #25D366; color: #fff; }
    .share-pdf { background: #0d6efd; color: #fff; }
    .share-btn:disabled { opacity: 0.5; }

    @media print {
      body { background: #fff; }
      .topbar, .no-print, .share-bar { display: none !important; }
      .container { padding: 0; max-width: 100%; }
      .slip-card {
        box-shadow: none;
        border: 1px solid #ccc;
        margin-bottom: 20px;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div>
      <a href="/settlement.html">← সেটেলমেন্ট</a>
      <strong>পেমেন্ট স্লিপ</strong>
    </div>
    <button id="printBtn" class="no-print">🖨️ সব প্রিন্ট / PDF</button>
  </div>

  <div class="container">
    <div id="slipContainer">
      <p style="text-align:center;color:#6c757d;">লোড হচ্ছে...</p>
    </div>
  </div>

  <script type="module" src="/js/payslip.js"></script>
</body>
</html>
